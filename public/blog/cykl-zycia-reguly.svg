<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Cykl życia reguły biznesowej</title>
  <desc id="description">Reguła przechodzi przez stany Draft, Approved, Active, Superseded i Retired. Stabilny identyfikator łączy jej kolejne wersje.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#171126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ce1e6"/>
      <stop offset="100%" stop-color="#a970ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71809b"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#background)"/>

  <text x="70" y="70" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Cykl życia reguły biznesowej
  </text>
  <text x="70" y="108" fill="#9aa7bd" font-family="Inter, Arial, sans-serif" font-size="19">
    Stabilna tożsamość, zmienne wersje i jawny okres obowiązywania
  </text>

  <rect x="70" y="145" width="1060" height="62" rx="16" fill="#20283a" stroke="#34405a"/>
  <text x="98" y="183" fill="#dbe5f7" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">
    Rule ID: LIBRARY_BORROWING_ELIGIBILITY
  </text>
  <text x="915" y="183" fill="#7ee7d8" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="end">
    trwała tożsamość
  </text>

  <line x1="258" y1="310" x2="300" y2="310" stroke="#71809b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="470" y1="310" x2="512" y2="310" stroke="#71809b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="682" y1="310" x2="724" y2="310" stroke="#71809b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="894" y1="310" x2="936" y2="310" stroke="#71809b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="255" width="188" height="110" rx="18" fill="#222b3e" stroke="#46536e"/>
    <rect x="282" y="255" width="188" height="110" rx="18" fill="#222b3e" stroke="#46536e"/>
    <rect x="494" y="255" width="188" height="110" rx="18" fill="#19363b" stroke="#5ce1e6"/>
    <rect x="706" y="255" width="188" height="110" rx="18" fill="#2c2642" stroke="#8f72d8"/>
    <rect x="918" y="255" width="212" height="110" rx="18" fill="#22242f" stroke="#454957"/>
  </g>

  <text x="164" y="308" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Draft</text>
  <text x="164" y="340" fill="#9aa7bd" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">wersja robocza</text>

  <text x="376" y="308" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Approved</text>
  <text x="376" y="340" fill="#9aa7bd" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">zatwierdzona</text>

  <text x="588" y="308" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Active</text>
  <text x="588" y="340" fill="#7ee7d8" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">obowiązuje</text>

  <text x="800" y="308" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Superseded</text>
  <text x="800" y="340" fill="#bca7f4" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">zastąpiona</text>

  <text x="1024" y="308" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Retired</text>
  <text x="1024" y="340" fill="#9aa7bd" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">wycofana</text>

  <rect x="70" y="408" width="1060" height="54" rx="14" fill="#191f2d" stroke="#2e394f"/>
  <rect x="70" y="408" width="520" height="4" rx="2" fill="url(#accent)"/>
  <text x="98" y="442" fill="#c7d2e7" font-family="Inter, Arial, sans-serif" font-size="17">
    Każda zmiana tworzy wersję, a nie nadpisuje historii decyzji.
  </text>
</svg>
