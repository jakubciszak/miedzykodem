<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
  <title id="title">Wertykalne i horyzontalne podejście do warunków biznesowych</title>
  <desc id="description">W podejściu wertykalnym każda strategia zawiera kompletny zestaw aspektów decyzji. W podejściu horyzontalnym każda polityka obsługuje jeden aspekt dla wielu typów użytkowników.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#171126"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="1000" rx="28" fill="url(#background)"/>

  <text x="60" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Dwa sposoby podziału warunków
  </text>
  <text x="60" y="96" fill="#9aa7bd" font-family="Inter, Arial, sans-serif" font-size="18">
    Te same wymagania, inne granice odpowiedzialności
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="125" width="1080" height="385" rx="22" fill="#1a2130" stroke="#35415a"/>
  </g>

  <text x="90" y="169" fill="#5ce1e6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">
    WERTYKALNIE
  </text>
  <text x="90" y="207" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">
    Strategia grupuje kompletny wariant zachowania
  </text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="90" y="235" width="235" height="208" rx="16" fill="#20283a" stroke="#46536e"/>
      <text x="207.5" y="270" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">DefaultStrategy</text>
      <rect x="108" y="290" width="199" height="29" rx="8" fill="#17414a" stroke="#5ce1e6"/>
      <text x="207.5" y="311" fill="#b9f5f7" font-size="15" text-anchor="middle">status konta</text>
      <rect x="108" y="328" width="199" height="29" rx="8" fill="#352d53" stroke="#a970ff"/>
      <text x="207.5" y="349" fill="#ded0ff" font-size="15" text-anchor="middle">limit wypożyczeń</text>
      <rect x="108" y="366" width="199" height="29" rx="8" fill="#4b3723" stroke="#f0ad4e"/>
      <text x="207.5" y="387" fill="#ffe0ad" font-size="15" text-anchor="middle">przetrzymane książki</text>
      <rect x="108" y="404" width="199" height="29" rx="8" fill="#203d32" stroke="#6fd6a2"/>
      <text x="207.5" y="425" fill="#c7f2dc" font-size="15" text-anchor="middle">termin zwrotu</text>
    </g>

    <g>
      <rect x="345" y="235" width="235" height="208" rx="16" fill="#20283a" stroke="#46536e"/>
      <text x="462.5" y="270" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">StudentStrategy</text>
      <rect x="363" y="290" width="199" height="29" rx="8" fill="#17414a" stroke="#5ce1e6"/>
      <text x="462.5" y="311" fill="#b9f5f7" font-size="15" text-anchor="middle">status konta</text>
      <rect x="363" y="328" width="199" height="29" rx="8" fill="#352d53" stroke="#a970ff"/>
      <text x="462.5" y="349" fill="#ded0ff" font-size="15" text-anchor="middle">limit wypożyczeń</text>
      <rect x="363" y="366" width="199" height="29" rx="8" fill="#4b3723" stroke="#f0ad4e"/>
      <text x="462.5" y="387" fill="#ffe0ad" font-size="15" text-anchor="middle">przetrzymane książki</text>
      <rect x="363" y="404" width="199" height="29" rx="8" fill="#203d32" stroke="#6fd6a2"/>
      <text x="462.5" y="425" fill="#c7f2dc" font-size="15" text-anchor="middle">termin zwrotu</text>
    </g>

    <g>
      <rect x="600" y="235" width="235" height="208" rx="16" fill="#20283a" stroke="#46536e"/>
      <text x="717.5" y="270" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">TeacherStrategy</text>
      <rect x="618" y="290" width="199" height="29" rx="8" fill="#17414a" stroke="#5ce1e6"/>
      <text x="717.5" y="311" fill="#b9f5f7" font-size="15" text-anchor="middle">status konta</text>
      <rect x="618" y="328" width="199" height="29" rx="8" fill="#352d53" stroke="#a970ff"/>
      <text x="717.5" y="349" fill="#ded0ff" font-size="15" text-anchor="middle">limit wypożyczeń</text>
      <rect x="618" y="366" width="199" height="29" rx="8" fill="#4b3723" stroke="#f0ad4e"/>
      <text x="717.5" y="387" fill="#ffe0ad" font-size="15" text-anchor="middle">przetrzymane książki</text>
      <rect x="618" y="404" width="199" height="29" rx="8" fill="#203d32" stroke="#6fd6a2"/>
      <text x="717.5" y="425" fill="#c7f2dc" font-size="15" text-anchor="middle">termin zwrotu</text>
    </g>

    <g>
      <rect x="855" y="235" width="235" height="208" rx="16" fill="#20283a" stroke="#46536e"/>
      <text x="972.5" y="270" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">EmployeeStrategy</text>
      <rect x="873" y="290" width="199" height="29" rx="8" fill="#17414a" stroke="#5ce1e6"/>
      <text x="972.5" y="311" fill="#b9f5f7" font-size="15" text-anchor="middle">status konta</text>
      <rect x="873" y="328" width="199" height="29" rx="8" fill="#352d53" stroke="#a970ff"/>
      <text x="972.5" y="349" fill="#ded0ff" font-size="15" text-anchor="middle">limit wypożyczeń</text>
      <rect x="873" y="366" width="199" height="29" rx="8" fill="#4b3723" stroke="#f0ad4e"/>
      <text x="972.5" y="387" fill="#ffe0ad" font-size="15" text-anchor="middle">przetrzymane książki</text>
      <rect x="873" y="404" width="199" height="29" rx="8" fill="#203d32" stroke="#6fd6a2"/>
      <text x="972.5" y="425" fill="#c7f2dc" font-size="15" text-anchor="middle">termin zwrotu</text>
    </g>
  </g>

  <text x="600" y="480" fill="#aebbd1" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">
    Wybór roli wybiera cały stos zachowań
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="540" width="1080" height="400" rx="22" fill="#1a2130" stroke="#35415a"/>
  </g>

  <text x="90" y="584" fill="#a970ff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">
    HORYZONTALNIE
  </text>
  <text x="90" y="622" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">
    Polityka grupuje jeden wymiar decyzji
  </text>

  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="405" y="646" width="145" height="34" rx="9" fill="#252d40" stroke="#46536e"/>
    <text x="477.5" y="669" fill="#dbe5f7" text-anchor="middle">Default</text>
    <rect x="565" y="646" width="145" height="34" rx="9" fill="#252d40" stroke="#46536e"/>
    <text x="637.5" y="669" fill="#dbe5f7" text-anchor="middle">Student</text>
    <rect x="725" y="646" width="145" height="34" rx="9" fill="#252d40" stroke="#46536e"/>
    <text x="797.5" y="669" fill="#dbe5f7" text-anchor="middle">Teacher</text>
    <rect x="885" y="646" width="145" height="34" rx="9" fill="#252d40" stroke="#46536e"/>
    <text x="957.5" y="669" fill="#dbe5f7" text-anchor="middle">Employee</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="90" y="698" width="1020" height="50" rx="12" fill="#17414a" stroke="#5ce1e6"/>
    <text x="118" y="730" fill="#ffffff" font-size="19" font-weight="700">AccountStatusPolicy</text>
    <g fill="#b9f5f7">
      <circle cx="477.5" cy="723" r="7"/>
      <circle cx="637.5" cy="723" r="7"/>
      <circle cx="797.5" cy="723" r="7"/>
      <circle cx="957.5" cy="723" r="7"/>
    </g>

    <rect x="90" y="760" width="1020" height="50" rx="12" fill="#352d53" stroke="#a970ff"/>
    <text x="118" y="792" fill="#ffffff" font-size="19" font-weight="700">BorrowingLimitPolicy</text>
    <g fill="#ded0ff">
      <circle cx="477.5" cy="785" r="7"/>
      <circle cx="637.5" cy="785" r="7"/>
      <circle cx="797.5" cy="785" r="7"/>
      <circle cx="957.5" cy="785" r="7"/>
    </g>

    <rect x="90" y="822" width="1020" height="50" rx="12" fill="#4b3723" stroke="#f0ad4e"/>
    <text x="118" y="854" fill="#ffffff" font-size="19" font-weight="700">OverdueBooksPolicy</text>
    <g fill="#ffe0ad">
      <circle cx="477.5" cy="847" r="7"/>
      <circle cx="637.5" cy="847" r="7"/>
      <circle cx="797.5" cy="847" r="7"/>
      <circle cx="957.5" cy="847" r="7"/>
    </g>

    <rect x="90" y="884" width="1020" height="50" rx="12" fill="#203d32" stroke="#6fd6a2"/>
    <text x="118" y="916" fill="#ffffff" font-size="19" font-weight="700">ReturnDatePolicy</text>
    <g fill="#c7f2dc">
      <circle cx="477.5" cy="909" r="7"/>
      <circle cx="637.5" cy="909" r="7"/>
      <circle cx="797.5" cy="909" r="7"/>
      <circle cx="957.5" cy="909" r="7"/>
    </g>
  </g>

  <text x="600" y="972" fill="#aebbd1" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">
    Każdy aspekt może obsługiwać wiele typów użytkowników
  </text>
</svg>
